# Task 1a: section analysis at a wind-tunnel condition of NACA TR 824 / Abbott & von Doenhoff.
# Paths are relative to this file.

[conditions]
reynolds = 8.9e6      # highest tested Re of the NACA 2412 data (TR 824 p.136)
mach = 0.15           # inside the tunnel range M < 0.17 (Abbott p.125)
ncrit = 10.0          # e^N: N = -8.43 - 2.4 ln(Tu) gives 9.8-11.0 for the LTPT turbulence

[xfoil]
panel_nodes = 240     # 160 (XFoil default) failed the 1 % check for 66-410; see sensitivity
max_iter = 200
alpha_low_deg = -8.0
alpha_high_deg = 26.0 # past stall at tunnel Re (16-19 deg) and at flight Re (about 21 deg)
alpha_step_deg = 0.25
stop_after_failures = 8

[metrics]
linear_alpha_min_deg = -4.0   # linear lift-curve window; R^2 of the fit is reported
linear_alpha_max_deg = 6.0
low_drag_factor = 0.10        # low-drag range: cd <= (1 + k) cd_min
spread_windows_deg = [[-2.0, 4.0], [-6.0, 8.0]]   # a0 and alpha_0L spread = fit uncertainty

[sensitivity]
panel_nodes = [100, 160, 240, 320, 400]
ncrit = [9.0, 10.0, 11.0]

[[airfoil]]
name = "NACA 2412"
file = "../airfoils/NACA2412.dat"
drag_bucket = false   # 4-digit: no laminar low-drag range

[[airfoil]]
name = "NACA 66-410"
file = "../airfoils/NACA66-410_gen.dat"
drag_bucket = true

# Polars for the 3D stage (group decision): normal-plane Reynolds number at cruise,
#   Re_n = rho V c_MAC / mu * cos^2(sweep_c/4)
#        = 0.37960 * 253.54 * 9.855 / 1.4334e-5 * cos^2(37.5 deg) = 6.617e7 * 0.6294 = 4.165e7,
# at low Mach number: XFoil's Karman-Tsien correction is not valid at the cruise normal Mach
# number (0.68), so compressibility is corrected in the 3D tool (VSP). At this Reynolds number
# the 66-410 has no laminar drag bucket (cd_min at cl = 0.03), so no low-drag range is reported.
[[extra_run]]
label = "3d_input"
reynolds = 4.17e7
mach = 0.1
ncrit = 10.0
output = "../results/3d_input"
report_low_drag = false
